name: CircuitToy
options:
  bundleIdPrefix: com.utkarsh
  deploymentTarget:
    iOS: '27.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.4.0'
    CURRENT_PROJECT_VERSION: '5'
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  CircuitCore:
    type: framework
    platform: iOS
    sources: [Sources/CircuitCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarsh.circuittoy.core
  CircuitToy:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: CircuitCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Circuit Toy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarsh.circuittoy
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CircuitToyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/NativeLessonTests]
    dependencies:
      - target: CircuitToy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarsh.circuittoy.uitests
schemes:
  CircuitToy:
    build:
      targets:
        CircuitToy: all
    test:
      targets: [CircuitToyUITests]
